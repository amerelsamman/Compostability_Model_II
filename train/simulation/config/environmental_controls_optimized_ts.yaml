environmental_controls:
  ts:
    miscibility_rule:
      enabled: false
      random_range:
      - 5.0
      - 7.0
      threshold: 0.3
    noise:
      enabled: false
      level: 0.05
      type: gaussian
    thickness:
      max: 600.0
      min: 10.0
      piecewise:
        thick_regime:
          min_thickness: 10.0
          power_law: -9.84332914939351e-05
          reference: 10.006408994765495
        thin_regime:
          max_thickness: 10.0
          power_law: -1.3698586602730032
          reference: 9.667362897949074
      reference: 25.0
      scaling_type: piecewise
global_settings:
  humidity_unit: '%'
  noise_types:
  - gaussian
  - uniform
  - none
  random_seed: 42
  scaling_types:
  - fixed
  - dynamic
  - piecewise
  - none
  temperature_unit: "\xB0C"
  thickness_unit: "\u03BCm"
